    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="topbar">
    <span class="mark">RK</span>
    <button class="theme" id="theme" type="button" aria-label="Switch color theme">Dark</button>
  </div>

  <header class="hero">
    <div class="hero-text">
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <p class="tagline" id="tagline"></p>
      <ul class="links" id="links"></ul>
    </div>

    <figure class="game" id="game">
      <div class="game-head">
        <p class="game-title">Spot the bots</p>
        <p class="game-help" id="game-help">Every dot is a visitor to a website. Bots move too perfectly. Hover to see their paths, then click the ones you think are bots.</p>
      </div>
      <canvas id="traffic" aria-label="Animated dots representing website visitors, some of which are bots"></canvas>
      <div class="game-foot">
        <dl class="score" aria-live="polite">
          <div><dt>Bots caught</dt><dd id="caught">0</dd></div>
          <div><dt>Humans blocked</dt><dd id="fp">0</dd></div>
          <div><dt>Bots left</dt><dd id="left">0</dd></div>
        </dl>
        <div class="game-buttons">
          <button type="button" id="detect" class="btn-primary">Run my detector</button>
          <button type="button" id="reset">Reset</button>
        </div>
      </div>
    </figure>
  </header>

  <div class="body">
    <aside class="side">
      <img class="me" id="photo" alt="Portrait of Ratan Kokku">
      <nav aria-label="Sections">
